name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Збираємо проєкт та запускаємо тести
      - name: Build and run tests
        run: mvn clean test

      # 2. ПРИМУСОВО ГЕНЕРУЄМО JAVADOC (це створить потрібну папку)
      - name: Generate Javadoc
        run: mvn javadoc:javadoc -DfailOnError=false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Завантажуємо згенеровану папку
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'target/site/apidocs'

      # 4. Публікуємо на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
