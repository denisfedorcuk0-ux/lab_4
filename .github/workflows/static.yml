name: Deploy Lab Javadoc

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Оскільки структура кастомна, mvn clean test перевірить чи все збирається
      - name: Build and run tests
        run: mvn clean test

      # Цей крок згенерує документацію для Letter, Word, Sentence тощо
      - name: Generate Javadoc
        run: mvn javadoc:javadoc

       Sir, Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Завантажуємо саме згенеровану папку apidocs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'target/site/apidocs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
